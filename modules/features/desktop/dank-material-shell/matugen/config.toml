[config]

[templates.bat]
input_path = "~/.config/matugen/templates/syntect/dankcolors.tmTheme"
output_path = "~/.config/bat/themes/dankcolors.tmTheme"
post_hook = "bat cache --build"

[templates.bibata-material-cursors]
input_path = "~/.config/matugen/templates/matugen/placeholder"
output_path = "~/.cache/matugen/cursor-theme"
colors_to_compare = [
  { name = "Classic", color = "#ffffff" },
  { name = "Ice-Blue", color = "#a8cbe2" },
  { name = "Sky-Blue", color = "#8dcdff" },
  { name = "Deep-Blue", color = "#00b4d8" },
  { name = "Soft-Blue", color = "#b2c5ff" },
  { name = "Mint", color = "#65dac4" },
  { name = "Seafoam", color = "#85dfcf" },
  { name = "Teal", color = "#008080" },
  { name = "Peach", color = "#ffb59a" },
  { name = "Apricot", color = "#ffc9a8" },
  { name = "Sunset", color = "#ffb785" },
  { name = "Blush", color = "#ffb4a8" },
  { name = "Salmon", color = "#fa8072" },
  { name = "Pink-Pastel", color = "#ffb0cb" },
  { name = "Pink-Rose", color = "#ffbade" },
  { name = "Lilac", color = "#ccbeff" },
  { name = "Violet", color = "#edb8ff" },
  { name = "Sage", color = "#c7f69a" },
  { name = "Lime", color = "#d5f6b8" },
  { name = "Moss", color = "#98971a" },
  { name = "Sand", color = "#d7c4b6" },
  { name = "Beige", color = "#f5e6ca" },
  { name = "Beige", color = "#d9c588" },
  { name = "Brown", color = "#cb824d" },
  { name = "Cloud", color = "#abb2bf" },
  { name = "Grey", color = "#c7ccd6" },
  { name = "Slate", color = "#708090" },
  { name = "Noir", color = "#8c8c8c" },
  { name = "Midnight", color = "#6d8c5a" },
  { name = "Charcoal", color = "#7591a3" },
]
compare_to = "{{colors.primary.default.hex}}"
post_hook = "niri-bibata-cursor-writer {{closest_color}} {{mode}}"

[templates.emacs]
input_path = "~/.config/matugen/templates/emacs/dankcolors-theme.el"
output_path = "~/.cache/emacs/themes/dankcolors-theme.el"

[templates.fish]
input_path = "~/.config/matugen/templates/fish/dankcolors.fish"
output_path = "~/.config/fish/conf.d/dankcolors.fish"

[templates.helix]
input_path = "~/.config/matugen/templates/helix/dankcolors.toml"
output_path = "~/.config/helix/themes/dankcolors.toml"

[templates.kdeglobals]
input_path = "~/.config/matugen/templates/kdeglobals/dankcolors"
output_path = "~/.config/kdeglobals"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty/dankcolors.conf"
output_path = "~/.config/kitty/themes/dankcolors.conf"

[templates.niri]
input_path = "~/.config/matugen/templates/niri/base.kdl"
output_path = "~/.config/niri/matugen/base.kdl"

[templates.obs-studio]
input_path = "~/.config/matugen/templates/obs-studio/dankcolors.obt"
output_path = "~/.config/obs-studio/themes/dankcolors.obt"

[templates.papirus-folders]
input_path = "~/.config/matugen/templates/matugen/placeholder"
output_path = "~/.cache/matugen/primary"
colors_to_compare = [
  { name = "adwaita", color = "#93C0EA" },
  { name = "blue", color = "#5294E2" },
  { name = "breeze", color = "#57B8EC" },
  { name = "darkcyan", color = "#45ABB7" },
  { name = "green", color = "#87B158" },
  { name = "green", color = "#b5ce9f" },
  { name = "indigo", color = "#5C6BC0" },
  { name = "nordic", color = "#81A1C1" },
  { name = "palebrown", color = "#D1BFAE" },
  { name = "pink", color = "#F06292" },
  { name = "pink", color = "#FFB0CB" },
  { name = "teal", color = "#16A085" },
  { name = "white", color = "#E4E4E4" },
  { name = "yellow", color = "#F9BD30" },
  { name = "black", color = "#4F4F4F" },
  { name = "bluegrey", color = "#607D8B" },
  { name = "brown", color = "#AE8E6C" },
  { name = "cyan", color = "#00BCD4" },
  { name = "deeporange", color = "#EB6637" },
  { name = "grey", color = "#8E8E8E" },
  { name = "magenta", color = "#CA71DF" },
  { name = "orange", color = "#EE923A" },
  { name = "paleorange", color = "#EECA8F" },
  { name = "red", color = "#A30002" },
  { name = "red", color = "#E25252" },
  { name = "red", color = "#FFB4AB" },
  { name = "violet", color = "#7E57C2" },
  { name = "violet", color = "#CEBDFF" },
]
compare_to = "{{colors.primary.default.hex}}"
post_hook = "if [ '{{mode}}' = 'dark' ]; then papirus-folders -C {{closest_color}} --theme Papirus-Dark; else papirus-folders -C {{closest_color}} --theme Papirus-Light; fi"

